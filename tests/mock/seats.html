<!doctype html><meta charset="utf-8"><title>seats</title>
<div id="adult"><button>1</button><button>2</button></div>
<div class="seat-map">
  <button data-seat="H10" class="sold" >H10</button>
  <button data-seat="H11" disabled>H11</button>
  <button data-seat="H12">H12</button>
  <button data-seat="G10">G10</button>
  <button data-seat="G11">G11</button>
</div>
<p id="picked"></p>
<button id="pay" onclick="location.href='pay.html?s='+[...document.querySelectorAll('.on')].map(b=>b.dataset.seat).join(',')">결제하기</button>
<script>
document.querySelectorAll('[data-seat]').forEach(b => b.onclick = () => b.classList.toggle('on'));
</script>
